version: 1
profile: baseline

output:
  file: payloads/baseline-full.jsonl
  request_path: /waf-test/baseline
  overwrite: false

metadata:
  suite_name: baseline-full
  description: Optimized representative coverage of ordinary WAF request-body processing paths
  tags: [baseline, optimized-coverage]

safety:
  max_cases: 5000
  max_wire_body_size: 67108864
  max_decompressed_size: 67108864

generation:
  formats: [json, form, xml, multipart, text, octet-stream]
  # Size is the value/filler length before it is repeated by wide/array/repeated-field structures.
  # Large single-value bodies are covered separately by baseline-large-body.yaml.
  sizes: [0, 1024, 8192]
  charsets: [utf-8, utf-16le]
  bom: [false]
  filler_kinds: [repeated, random-ascii, unicode]
  value_encoding_profile: recommended
  compressions: [none, gzip, deflate]
  structures:
    depth: 64
    width: 256
    fields: 512
