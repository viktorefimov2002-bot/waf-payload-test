version: 1
name: high-rps-parallel

target:
  url: https://waf.example.invalid

input:
  payload_file: payloads/baseline-full.jsonl
  k6_script: k6_run_payloads.js

execution:
  mode: high-rps
  # Keep enough cases in one k6 process to amortize startup overhead.
  batch_size: 40
  # RPS is applied to every active case, not divided between lanes.
  rps: 30
  duration: 5s
  cooldown: 1
  graceful_stop: 2s
  lanes: 4
  # Safety guard: lanes * rps must not exceed this value.
  max_total_rps: 120
  # These limits are per active case scenario.
  preallocated_vus: 20
  max_vus: 80

  # A slot is duration + graceful_stop + cooldown, so adjacent waves do not overlap.
  # Explicit YAML bool tags prevent accidental string interpretation after edits.
  abort_on_overload: !!bool true
  max_dropped_iterations: 10
  max_http_req_duration_p95_ms: 3000
  overload_delay: 5s
  stop_run_on_batch_abort: !!bool true

  threshold_mode: disabled
  batch_max_duration: 24h

selection:
  start_index: 0

output:
  results_dir: results
  print_request: none
  terminate_timeout: 15
  lane_journals: !!bool true
