version: 1
name: high-rps-recheck

target:
  url: https://waf.example.invalid

input:
  payload_file: payloads/baseline-full.jsonl
  k6_script: k6_run_payloads.js

execution:
  mode: high-rps
  batch_size: 5
  rps: 100
  duration: 5s
  cooldown: 5
  graceful_stop: 2s
  threshold_mode: strict
  batch_max_duration: 1h
  preallocated_vus: 50
  max_vus: 200
  lanes: 1
  max_total_rps: 100
  abort_on_overload: true
  max_dropped_iterations: 0
  max_http_req_duration_p95_ms: 3000
  overload_delay: 5s
  stop_run_on_batch_abort: true

selection:
  start_index: 0
  limit: 5

output:
  results_dir: results
  print_request: headers
  terminate_timeout: 15
  lane_journals: true
